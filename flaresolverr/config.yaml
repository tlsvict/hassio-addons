arch:
  - aarch64
  - amd64
description: Proxy server to bypass Cloudflare protection
video: true
image: ghcr.io/tlsvict/flaresolverr-{arch}
name: FlareSolverr
options:
  env_vars: []
ports:
  8191/tcp: 8191
ports_description:
  8191/tcp: Web interface
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
slug: flaresolverr
udev: true
url: https://github.com/alexbelgium/hassio-addons
version: "3.4.6"
webui: "[PROTO:ssl]://[HOST]:[PORT:8191]"
